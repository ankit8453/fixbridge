name: fixbridge_partner
description: Technician app for the verified hyperlocal services marketplace.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0

  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  google_fonts: ^6.2.1
  intl: ^0.20.3

  # Dialling the customer, and opening their address in a maps app.
  url_launcher: ^6.3.1

  # Verification documents: an ID photo, a selfie, a certificate.
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
