name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback with no infrastructure: lint, format, build, unit tests.
  verify:
    name: Lint, build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The config schema requires these; the unit job has no services, but the
      # values still have to parse. They are not secrets.
      - name: Provide a parseable environment
        run: |
          echo "JWT_SECRET=ci-only-secret-value-at-least-32-characters-long" >> "$GITHUB_ENV"
          echo "S3_ACCESS_KEY_ID=ci" >> "$GITHUB_ENV"
          echo "S3_SECRET_ACCESS_KEY=ci-secret" >> "$GITHUB_ENV"

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

  # Proves migrations apply to a completely fresh database and that /health
  # goes green against real Postgres + Redis.
  integration:
    name: Migrations, seed & integration tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: fixbridge
          POSTGRES_PASSWORD: fixbridge
          POSTGRES_DB: fixbridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fixbridge -d fixbridge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

      # Object storage for the KYC document round-trip.
      minio:
        image: minio/minio:RELEASE.2025-04-22T22-12-26Z
        env:
          MINIO_ROOT_USER: fixbridge
          MINIO_ROOT_PASSWORD: fixbridge-dev-secret
        ports:
          - 9000:9000
        options: >-
          --health-cmd "mc ready local"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      NODE_ENV: test
      LOG_LEVEL: silent
      DATABASE_URL: postgresql://fixbridge:fixbridge@localhost:5432/fixbridge?schema=public
      REDIS_URL: redis://localhost:6379
      # Test-only auth settings. Not secrets — the fixed OTP is refused outright
      # by the config schema whenever NODE_ENV=production.
      JWT_SECRET: ci-only-secret-value-at-least-32-characters-long
      AUTH_FIXED_OTP: '000000'
      AUTH_FIXED_OTP_PHONE_PREFIX: '+9199999'
      SEED_ADMIN_PHONE: '+919999900001'
      SEED_OPS_PHONE: '+919999900002'
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: fixbridge
      S3_SECRET_ACCESS_KEY: fixbridge-dev-secret
      S3_BUCKET: fixbridge-kyc
      S3_FORCE_PATH_STYLE: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations to a fresh database
        run: npm run migrate:deploy

      - name: Seed
        run: npm run seed

      - name: Seed again (must be idempotent)
        run: npm run seed

      - name: Full test suite (unit + integration)
        run: npm test
